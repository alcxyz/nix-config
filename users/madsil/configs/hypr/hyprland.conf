# hyprland.conf

# Sources
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/binds.conf

monitor=, preferred, auto, 1

env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3

exec-once = bash -c "wl-paste --watch cliphist store &"
exec-once = dms run

ecosystem {
  no_update_news = true
}

input {
  kb_layout = no
  numlock_by_default = true

  follow_mouse = 2

  touchpad {
    natural_scroll = yes
  }

  sensitivity = 1.0
}

general {
  gaps_in = 2
  gaps_out = 2
  border_size = 2

  layout = scrolling
  allow_tearing = true
  no_focus_fallback = false
}

decoration {
  rounding = 2

  active_opacity = 1.0
  inactive_opacity = 0.95

  shadow {
      enabled = true
      range = 30
      render_power = 5
      offset = 0 5
      color = rgba(00000070)
  }
}

animations {
  enabled = true

  bezier = myBezier, 0.05, 0.9, 0.1, 1.0

  animation = windows, 1, 3, myBezier
  animation = windowsOut, 1, 3, default, popin 80%
  animation = border, 1, 5, default
  animation = fade, 1, 3, default
  animation = workspaces, 1, 4, default, slidevert
  animation = specialWorkspace, 0
}

dwindle {
  pseudotile = false
  preserve_split = false
  use_active_for_splits = yes
}

# Master layout tuned for ultrawide (if you switch back)
master {
  mfact = 0.5
  orientation = left
  special_scale_factor = 0.9
}

# Gaming misc
misc {
  #force_default_wallpaper = 0
  disable_hyprland_logo = true
  #vrr = 2
}

scrolling {
  column_width = 0.333
  fullscreen_on_one_column = false
  focus_fit_method = 1
  follow_focus = false
  # Presets for SUPER+comma/period
  explicit_column_widths = 0.166,0.25,0.333,0.5,0.666,1
}

source = ./dms/outputs.conf
