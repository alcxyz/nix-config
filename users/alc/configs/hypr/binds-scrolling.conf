# =========================
# SCROLLING LAYOUT BINDINGS
# =========================

# Horizontal column navigation
bind = SUPER, h, layoutmsg, focus l
bind = SUPER, l, layoutmsg, focus r
bind = SUPER, left, layoutmsg, focus l
bind = SUPER, right, layoutmsg, focus r

# Swap columns
bind = SUPER SHIFT, H, layoutmsg, swapcol l
bind = SUPER SHIFT, L, layoutmsg, swapcol r
bind = SUPER SHIFT, left, layoutmsg, swapcol l
bind = SUPER SHIFT, right, layoutmsg, swapcol r

# Viewport extremes (Niri-ish: first/last region of strip)
bind = SUPER CTRL, N, layoutmsg, fit tobeg
bind = SUPER CTRL, M, layoutmsg, fit toend
bind = SUPER CTRL, comma, layoutmsg, fit visible
bind = SUPER CTRL, period, layoutmsg, fit all

# Consume / Expel
# Y: consume into column on the left
bind = SUPER CTRL, Y, layoutmsg, movewindowto l
# U: expel into its own column
bind = SUPER CTRL, U, layoutmsg, promote

# Center focused column
bind = SUPER, C, layoutmsg, center

# Column width presets (25% <-> 50%)
bind = SUPER, comma, layoutmsg, colresize -conf
bind = SUPER, period, layoutmsg, colresize +conf
