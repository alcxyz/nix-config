# App aliases
$scripts = ~/.config/hypr/scripts
$term = foot
$file = nautilus
$mail = thunderbird
$lock = hyprlock
$zen = zen

# =========================
# CORE PHILOSOPHY BINDINGS
# =========================

# HELP & SESSION
bind = SUPER SHIFT, escape, exit
bind = SUPER, Q, exec, dms ipc call lock lock
bind = SUPER, BACKSPACE, exec, dms ipc call powermenu toggle
bind = SUPER, SPACE, exec, dms ipc call spotlight toggle

# QUICK ACCESS (Alt prefix)
bind = ALT, RETURN, exec, $term

# APPLICATIONS
bind = SUPER, B, exec, $zen --no-remote -profile /home/alc/.zen/alcxyz
bind = SUPER, V, exec, $zen --no-remote -profile /home/alc/.zen/media
bind = SUPER, X, exec, $zen --no-remote -profile /home/alc/.zen/xyz
bind = SUPER, G, exec, $mail
bind = SUPER, F, exec, $file

# SYSTEM ACTIONS
bind = SUPER SHIFT, N, exec, dms ipc call notifications open
bind = SUPER SHIFT, C, exec, dms ipc call wallpaper next
bind = SUPER SHIFT, R, exec, dms ipc call bar toggle index 0

# WINDOW MANAGEMENT
bind = SUPER, W, killactive,
bind = SUPER, T, exec, t3code
bind = SUPER, S, togglefloating,
bind = SUPER, RETURN, fullscreen,
bind = SUPER, O, exec, dms ipc call hypr toggleOverview

# VERTICAL NAVIGATION (workspaces)
bind = SUPER, J, workspace, r-1
bind = SUPER, K, workspace, r+1
bind = SUPER, down, workspace, r-1
bind = SUPER, up, workspace, r+1

# Workspace previous
bind = SUPER, TAB, workspace, previous
bind = ALT, Tab, movefocus, d

# MOVE TO ADJACENT WORKSPACES
bind = SUPER SHIFT, J, movetoworkspace, r-1
bind = SUPER SHIFT, K, movetoworkspace, r+1
bind = SUPER SHIFT, down, movetoworkspace, r-1
bind = SUPER SHIFT, up, movetoworkspace, r+1

# WORKSPACE DIRECT ACCESS
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# MOVE TO NUMBERED WORKSPACES
bind = SUPER CTRL, 1, movetoworkspace, 1
bind = SUPER CTRL, 2, movetoworkspace, 2
bind = SUPER CTRL, 3, movetoworkspace, 3
bind = SUPER CTRL, 4, movetoworkspace, 4
bind = SUPER CTRL, 5, movetoworkspace, 5
bind = SUPER CTRL, 6, movetoworkspace, 6
bind = SUPER CTRL, 7, movetoworkspace, 7
bind = SUPER CTRL, 8, movetoworkspace, 8
bind = SUPER CTRL, 9, movetoworkspace, 9
bind = SUPER CTRL, 0, movetoworkspace, 10

# SCRATCHPAD
bind = SUPER ALT, ESCAPE, movetoworkspacesilent, special
bind = SUPER, ESCAPE, togglespecialworkspace

# SILENT MOVE TO ADJACENT WORKSPACES
bind = SUPER ALT, J, movetoworkspacesilent, r-1
bind = SUPER ALT, K, movetoworkspacesilent, r+1
bind = SUPER ALT, down, movetoworkspacesilent, r-1
bind = SUPER ALT, up, movetoworkspacesilent, r+1

# SILENT MOVE TO NUMBERED WORKSPACES
bind = SUPER ALT, 1, movetoworkspacesilent, 1
bind = SUPER ALT, 2, movetoworkspacesilent, 2
bind = SUPER ALT, 3, movetoworkspacesilent, 3
bind = SUPER ALT, 4, movetoworkspacesilent, 4
bind = SUPER ALT, 5, movetoworkspacesilent, 5
bind = SUPER ALT, 6, movetoworkspacesilent, 6
bind = SUPER ALT, 7, movetoworkspacesilent, 7
bind = SUPER ALT, 8, movetoworkspacesilent, 8
bind = SUPER ALT, 9, movetoworkspacesilent, 9
bind = SUPER ALT, 0, movetoworkspacesilent, 10

# F-KEYS (double-tap handler)
bind = , F1, exec, ~/.config/hypr/scripts/fkey_handler.sh F1 1
bind = , F2, exec, ~/.config/hypr/scripts/fkey_handler.sh F2 2
bind = , F3, exec, ~/.config/hypr/scripts/fkey_handler.sh F3 3
bind = , F4, exec, ~/.config/hypr/scripts/fkey_handler.sh F4 4
bind = , F5, exec, ~/.config/hypr/scripts/fkey_handler.sh F5 5
bind = , F6, exec, ~/.config/hypr/scripts/fkey_handler.sh F6 6

# Raw F-keys passthrough with Alt
bindr = ALT, F1, exec, wtype -k F1
bindr = ALT, F2, exec, wtype -k F2
bindr = ALT, F3, exec, wtype -k F3
bindr = ALT, F4, exec, wtype -k F4
bindr = ALT, F5, exec, wtype -k F5
bindr = ALT, F6, exec, wtype -k F6

# MOUSE INTEGRATION
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER CTRL, mouse_up, movefocus, l
bind = SUPER CTRL, mouse_down, movefocus, r
bind = SUPER, mouse_up, workspace, r+1
bind = SUPER, mouse_down, workspace, r-1

# =========================
# WINDOW RULES
# =========================

windowrule = opacity 0.98 0.98, match:class foot
windowrule = opacity 0.90 0.90, match:class dropterm

# =========================
# MISC
# =========================

# Layout switching
bind = SUPER CTRL, S, exec, hyprctl keyword general:layout scrolling
bind = SUPER CTRL SHIFT, S, exec, hyprctl keyword general:layout dwindle

# Audio Controls
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindl = , XF86AudioMute, exec, dms ipc call audio mute

bindel = , F10, exec, dms ipc call audio increment 3
bindel = , F9, exec, dms ipc call audio decrement 3
bindl = , F8, exec, dms ipc call audio mute

# MEDIA & SCREENSHOTS
bind = SUPER SHIFT, 4, exec, dms screenshot

bind = SUPER, N, exec, dms ipc call notepad toggle
bind = ALT, SPACE, exec, hyprscratch toggle dropterm

# =========================
# LAYOUT-SPECIFIC BINDINGS
# =========================

source = ~/.config/hypr/binds-scrolling.conf
#source = ~/.config/hypr/binds-dwindle.conf
