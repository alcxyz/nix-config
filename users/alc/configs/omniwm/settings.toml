# ═══════════════════════════════════════════════════════════
# App Rules — float apps that shouldn't tile
# ═══════════════════════════════════════════════════════════

[[appRules]]
id = "rule-system-settings"
bundleId = "com.apple.systempreferences"
layout = "float"

[[appRules]]
id = "rule-calculator"
bundleId = "com.apple.calculator"
layout = "float"

[[appRules]]
id = "rule-activity-monitor"
bundleId = "com.apple.ActivityMonitor"
layout = "float"

[[appRules]]
id = "rule-raycast"
bundleId = "com.raycast.macos"
layout = "float"
