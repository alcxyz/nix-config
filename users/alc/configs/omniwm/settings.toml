version = 4

# ═══════════════════════════════════════════════════════════
# OmniWM config — matching Hyprland scrolling layout
# ═══════════════════════════════════════════════════════════

[general]
hotkeysEnabled = true
defaultLayoutType = "niri"
animationsEnabled = true
preventSleepEnabled = false
ipcEnabled = true

[focus]
followsMouse = true
moveMouseToFocusedWindow = false

# ── Gaps (matching Hyprland gaps_in=2, gaps_out=2) ──
[gaps]
size = 4.0
[gaps.outer]
left = 4.0
right = 4.0
top = 4.0
bottom = 4.0

# ── Niri scrolling layout ──
[niri]
maxWindowsPerColumn = 3
maxVisibleColumns = 2
infiniteLoop = false
centerFocusedColumn = "onOverflow"
alwaysCenterSingleColumn = true
singleWindowAspectRatio = "fill"
# Match Hyprland explicit_column_widths = 0.166,0.25,0.333,0.5,0.666,1
columnWidthPresets = [0.25, 0.333333, 0.5, 0.666, 1.0]

# ── Borders (matching Hyprland border_size=2) ──
[borders]
enabled = true
width = 2.0

# ── Workspace bar ──
[workspaceBar]
enabled = true
showLabels = true
showFloatingWindows = false
position = "overlappingMenuBar"
hideEmptyWorkspaces = false
height = 24.0
backgroundOpacity = 0.1

# ── Trackpad gestures for scrolling ──
[gestures]
scrollEnabled = true
scrollSensitivity = 5.0
scrollModifierKey = "optionShift"
fingerCount = 3
invertDirection = true

# ── Quake terminal (replaces WezTerm toggle) ──
[quakeTerminal]
enabled = true
position = "top"
widthPercent = 100.0
heightPercent = 50.0
animationDuration = 0.15
autoHide = false
opacity = 0.90
monitorMode = "focusedWindow"

[appearance]
mode = "dark"

# ═══════════════════════════════════════════════════════════
# Hotkeys — matching Hyprland binds.conf
# F13 = Super (via 'a' hold in Karabiner), mirroring SUPER on Hyprland
# F13+Shift for secondary actions (move), like SUPER+Shift on Hyprland
# ═══════════════════════════════════════════════════════════

# ── Focus (Super + HJKL) ──
[[hotkeys]]
id = "focus.left"
binding = "F13+H"

[[hotkeys]]
id = "focus.down"
binding = "F13+J"

[[hotkeys]]
id = "focus.up"
binding = "F13+K"

[[hotkeys]]
id = "focus.right"
binding = "F13+L"

# ── Move windows (Super + Shift + HJKL) ──
[[hotkeys]]
id = "move.left"
binding = "F13+Shift+H"

[[hotkeys]]
id = "move.down"
binding = "F13+Shift+J"

[[hotkeys]]
id = "move.up"
binding = "F13+Shift+K"

[[hotkeys]]
id = "move.right"
binding = "F13+Shift+L"

# ── Move columns (Super + Shift + arrows) ──
[[hotkeys]]
id = "moveColumn.left"
binding = "F13+Shift+Left Arrow"

[[hotkeys]]
id = "moveColumn.right"
binding = "F13+Shift+Right Arrow"

# ── Fullscreen (Super + Return) ──
[[hotkeys]]
id = "toggleFullscreen"
binding = "F13+Return"

# ── Float toggle (Super + Shift + Space) ──
[[hotkeys]]
id = "toggleFocusedWindowFloating"
binding = "F13+Shift+Space"

# ── Column width cycle (Super + comma/period) ──
[[hotkeys]]
id = "cycleColumnWidthForward"
binding = "F13+."

[[hotkeys]]
id = "cycleColumnWidthBackward"
binding = "F13+,"

# ── Column full width (Super + Shift + F) ──
[[hotkeys]]
id = "toggleColumnFullWidth"
binding = "F13+Shift+F"

# ── Column tabbed mode (Super + T) ──
[[hotkeys]]
id = "toggleColumnTabbed"
binding = "F13+T"

# ── Balance (Super + Shift + B) ──
[[hotkeys]]
id = "balanceSizes"
binding = "F13+Shift+B"

# ── Workspaces (Super + 1-9) ──
[[hotkeys]]
id = "switchWorkspace.0"
binding = "F13+1"

[[hotkeys]]
id = "switchWorkspace.1"
binding = "F13+2"

[[hotkeys]]
id = "switchWorkspace.2"
binding = "F13+3"

[[hotkeys]]
id = "switchWorkspace.3"
binding = "F13+4"

[[hotkeys]]
id = "switchWorkspace.4"
binding = "F13+5"

[[hotkeys]]
id = "switchWorkspace.5"
binding = "F13+6"

[[hotkeys]]
id = "switchWorkspace.6"
binding = "F13+7"

[[hotkeys]]
id = "switchWorkspace.7"
binding = "F13+8"

[[hotkeys]]
id = "switchWorkspace.8"
binding = "F13+9"

# ── Move to workspace (Super + Shift + 1-9) ──
[[hotkeys]]
id = "moveToWorkspace.0"
binding = "F13+Shift+1"

[[hotkeys]]
id = "moveToWorkspace.1"
binding = "F13+Shift+2"

[[hotkeys]]
id = "moveToWorkspace.2"
binding = "F13+Shift+3"

[[hotkeys]]
id = "moveToWorkspace.3"
binding = "F13+Shift+4"

[[hotkeys]]
id = "moveToWorkspace.4"
binding = "F13+Shift+5"

[[hotkeys]]
id = "moveToWorkspace.5"
binding = "F13+Shift+6"

[[hotkeys]]
id = "moveToWorkspace.6"
binding = "F13+Shift+7"

[[hotkeys]]
id = "moveToWorkspace.7"
binding = "F13+Shift+8"

[[hotkeys]]
id = "moveToWorkspace.8"
binding = "F13+Shift+9"

# ── Previous workspace (Super + Tab) ──
[[hotkeys]]
id = "workspaceBackAndForth"
binding = "F13+Tab"

# ── Overview (Super + O) ──
[[hotkeys]]
id = "toggleOverview"
binding = "F13+O"

# ── Command palette (Super + P) ──
[[hotkeys]]
id = "openCommandPalette"
binding = "F13+P"

# ── Quake terminal (Super + Space) ──
[[hotkeys]]
id = "toggleQuakeTerminal"
binding = "F13+Space"

# ── Scratchpad ──
[[hotkeys]]
id = "toggleScratchpadWindow"
binding = "F13+Escape"

[[hotkeys]]
id = "assignFocusedWindowToScratchpad"
binding = "F13+Shift+Escape"

