version = 4

# ═══════════════════════════════════════════════════════════
# OmniWM config — matching Hyprland scrolling layout
# ═══════════════════════════════════════════════════════════

[general]
hotkeysEnabled = true
defaultLayoutType = "niri"
animationsEnabled = true
preventSleepEnabled = false
ipcEnabled = true

[focus]
followsMouse = true
moveMouseToFocusedWindow = false

# ── Gaps (matching Hyprland gaps_in=2, gaps_out=2) ──
[gaps]
size = 4.0
[gaps.outer]
left = 4.0
right = 4.0
top = 4.0
bottom = 4.0

# ── Niri scrolling layout ──
[niri]
maxWindowsPerColumn = 3
maxVisibleColumns = 2
infiniteLoop = false
centerFocusedColumn = "onOverflow"
alwaysCenterSingleColumn = true
singleWindowAspectRatio = "fill"
# Match Hyprland explicit_column_widths = 0.166,0.25,0.333,0.5,0.666,1
columnWidthPresets = [0.25, 0.333333, 0.5, 0.666, 1.0]

# ── Borders (matching Hyprland border_size=2) ──
[borders]
enabled = true
width = 2.0

# ── Workspace bar ──
[workspaceBar]
enabled = true
showLabels = true
showFloatingWindows = false
position = "overlappingMenuBar"
hideEmptyWorkspaces = false
height = 24.0
backgroundOpacity = 0.1

# ── Trackpad gestures for scrolling ──
[gestures]
scrollEnabled = true
scrollSensitivity = 5.0
scrollModifierKey = "optionShift"
fingerCount = 3
invertDirection = true

# ── Quake terminal (replaces WezTerm toggle) ──
[quakeTerminal]
enabled = true
position = "top"
widthPercent = 100.0
heightPercent = 50.0
animationDuration = 0.15
autoHide = false
opacity = 0.90
monitorMode = "focusedWindow"

[appearance]
mode = "dark"

# ═══════════════════════════════════════════════════════════
# Hotkeys — matching Hyprland binds.conf
# Using Hyper (Ctrl+Option+Command+Shift) as primary modifier via home row mod (a hold)
# ═══════════════════════════════════════════════════════════

# ── Focus (Hyper + HJKL) — hold 'a' + hjkl ──
[[hotkeys]]
id = "focus.left"
binding = "Control+Option+Command+Shift+H"

[[hotkeys]]
id = "focus.down"
binding = "Control+Option+Command+Shift+J"

[[hotkeys]]
id = "focus.up"
binding = "Control+Option+Command+Shift+K"

[[hotkeys]]
id = "focus.right"
binding = "Control+Option+Command+Shift+L"

# ── Move windows (Meh + HJKL) — hold ';' + hjkl ──
[[hotkeys]]
id = "move.left"
binding = "Control+Option+Shift+H"

[[hotkeys]]
id = "move.down"
binding = "Control+Option+Shift+J"

[[hotkeys]]
id = "move.up"
binding = "Control+Option+Shift+K"

[[hotkeys]]
id = "move.right"
binding = "Control+Option+Shift+L"

# ── Move columns (Meh + arrows) ──
[[hotkeys]]
id = "moveColumn.left"
binding = "Control+Option+Shift+Left Arrow"

[[hotkeys]]
id = "moveColumn.right"
binding = "Control+Option+Shift+Right Arrow"

# ── Fullscreen (Hyper + Return) ──
[[hotkeys]]
id = "toggleFullscreen"
binding = "Control+Option+Command+Shift+Return"

# ── Float toggle (Meh + Space) ──
[[hotkeys]]
id = "toggleFocusedWindowFloating"
binding = "Control+Option+Shift+Space"

# ── Column width cycle (Hyper + comma/period) ──
[[hotkeys]]
id = "cycleColumnWidthForward"
binding = "Control+Option+Command+Shift+."

[[hotkeys]]
id = "cycleColumnWidthBackward"
binding = "Control+Option+Command+Shift+,"

# ── Column full width (Meh + F) ──
[[hotkeys]]
id = "toggleColumnFullWidth"
binding = "Control+Option+Shift+F"

# ── Column tabbed mode (Hyper + T) ──
[[hotkeys]]
id = "toggleColumnTabbed"
binding = "Control+Option+Command+Shift+T"

# ── Balance (Meh + B) ──
[[hotkeys]]
id = "balanceSizes"
binding = "Control+Option+Shift+B"

# ── Workspaces (Hyper + 1-9) — hold 'a' + number ──
[[hotkeys]]
id = "switchWorkspace.0"
binding = "Control+Option+Command+Shift+1"

[[hotkeys]]
id = "switchWorkspace.1"
binding = "Control+Option+Command+Shift+2"

[[hotkeys]]
id = "switchWorkspace.2"
binding = "Control+Option+Command+Shift+3"

[[hotkeys]]
id = "switchWorkspace.3"
binding = "Control+Option+Command+Shift+4"

[[hotkeys]]
id = "switchWorkspace.4"
binding = "Control+Option+Command+Shift+5"

[[hotkeys]]
id = "switchWorkspace.5"
binding = "Control+Option+Command+Shift+6"

[[hotkeys]]
id = "switchWorkspace.6"
binding = "Control+Option+Command+Shift+7"

[[hotkeys]]
id = "switchWorkspace.7"
binding = "Control+Option+Command+Shift+8"

[[hotkeys]]
id = "switchWorkspace.8"
binding = "Control+Option+Command+Shift+9"

# ── Move to workspace (Meh + 1-9) — hold ';' + number ──
[[hotkeys]]
id = "moveToWorkspace.0"
binding = "Control+Option+Shift+1"

[[hotkeys]]
id = "moveToWorkspace.1"
binding = "Control+Option+Shift+2"

[[hotkeys]]
id = "moveToWorkspace.2"
binding = "Control+Option+Shift+3"

[[hotkeys]]
id = "moveToWorkspace.3"
binding = "Control+Option+Shift+4"

[[hotkeys]]
id = "moveToWorkspace.4"
binding = "Control+Option+Shift+5"

[[hotkeys]]
id = "moveToWorkspace.5"
binding = "Control+Option+Shift+6"

[[hotkeys]]
id = "moveToWorkspace.6"
binding = "Control+Option+Shift+7"

[[hotkeys]]
id = "moveToWorkspace.7"
binding = "Control+Option+Shift+8"

[[hotkeys]]
id = "moveToWorkspace.8"
binding = "Control+Option+Shift+9"

# ── Previous workspace (Hyper + Tab) ──
[[hotkeys]]
id = "workspaceBackAndForth"
binding = "Control+Option+Command+Shift+Tab"

# ── Overview (Hyper + O) ──
[[hotkeys]]
id = "toggleOverview"
binding = "Control+Option+Command+Shift+O"

# ── Command palette (Hyper + P) ──
[[hotkeys]]
id = "openCommandPalette"
binding = "Control+Option+Command+Shift+P"

# ── Quake terminal (Hyper + Space) ──
[[hotkeys]]
id = "toggleQuakeTerminal"
binding = "Control+Option+Command+Shift+Space"

# ── Scratchpad ──
[[hotkeys]]
id = "toggleScratchpadWindow"
binding = "Control+Option+Command+Shift+Escape"

[[hotkeys]]
id = "assignFocusedWindowToScratchpad"
binding = "Control+Option+Shift+Escape"

