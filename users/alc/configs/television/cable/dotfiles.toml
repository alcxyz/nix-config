[metadata]
name = "dotfiles"
description = "Browse and edit dotfiles"
requirements = ["fd", "bat"]

[source]
command = "fd -H -t f -E .git -E node_modules . ~/.config"

[preview]
command = "bat --color=always --style=numbers --line-range=:100 '{}'"

[actions.edit]
description = "Edit in nvim"
command = "nvim '{}'"
mode = "execute"

[actions.copy_path]
description = "Copy path to clipboard"
command = "echo -n '{}' | wl-copy"
