name: Publish Wolf images
run-name: "Wolf image build (${{ forgejo.event_name }})"

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after building the images
        required: true
        default: false
        type: boolean
      channel:
        description: Channel recorded by a non-publishing branch build
        required: true
        default: dev
        type: choice
        options:
          - dev
          - main
      source_sha:
        description: Full committed revision of the prepared contexts
        required: true
        type: string

jobs:
  build:
    name: Publish exact Nix-owned contexts
    runs-on: forgejo-podman-canary
    container:
      image: docker.io/library/node:20-bookworm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - product: wolf
          - product: helium
          - product: brave
          - product: zen
    steps:
      - name: Prepare action copy paths
        run: |
          # Podman's archive API rejects action paths through this absolute symlink.
          if [ -L /var/run ] && [ "$(readlink -f /var/run)" = /run ]; then
            rm /var/run
            mkdir -m 0755 /var/run
            if [ -d /run/act ]; then
              cp -a /run/act /var/run/act
            fi
            if [ -S /run/docker.sock ]; then
              ln -s /run/docker.sock /var/run/docker.sock
            fi
          fi

      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          github-server-url: https://git.alc.xyz
          ref: ${{ forgejo.sha }}
          persist-credentials: false

      - name: Select and validate the release channel
        env:
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          case "$DISPATCH_CHANNEL" in
            dev | main) ;;
            *) exit 1 ;;
          esac
          case "$SOURCE_SHA" in
            *[!0-9a-f]* | "") exit 1 ;;
          esac
          [ "${#SOURCE_SHA}" -eq 40 ] || exit 1
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || {
            echo 'Checkout is not the prepared Wolf source revision.' >&2
            exit 1
          }
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --quiet --no-tags --unshallow origin "refs/heads/$DISPATCH_CHANNEL"
          else
            git fetch --quiet --no-tags origin "refs/heads/$DISPATCH_CHANNEL"
          fi
          git merge-base --is-ancestor "$SOURCE_SHA" FETCH_HEAD || {
            echo 'Prepared Wolf source is not in the trusted channel.' >&2
            exit 1
          }
          printf 'WOLF_CHANNEL=%s\n' "$DISPATCH_CHANNEL" >>"$GITHUB_ENV"

      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y curl docker.io git jq python3 sudo udev zstd
          install -d /usr/local/lib/docker/cli-plugins
          curl --fail --location --silent --show-error \
            https://github.com/docker/buildx/releases/download/v0.20.1/buildx-v0.20.1.linux-amd64 \
            --output /usr/local/lib/docker/cli-plugins/docker-buildx
          printf '%s\n' \
            '8c38f60308a895fa570f1410e453c5de11aafd65a99fa99965d96d24b6225a78  /usr/local/lib/docker/cli-plugins/docker-buildx' \
            | sha256sum --check
          chmod +x /usr/local/lib/docker/cli-plugins/docker-buildx
          docker buildx version

      - name: Download the exact native image context
        env:
          WOLF_REGISTRY_TOKEN: ${{ secrets.WOLF_REGISTRY_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/wolf-context-package.py download \
            --url https://git.alc.xyz --owner alcxyz \
            --channel "$WOLF_CHANNEL" --sha "$SOURCE_SHA" \
            --user alcxyz --token-env WOLF_REGISTRY_TOKEN \
            --product '${{ matrix.product }}' --output wolf-context.tar.zst
          mkdir wolf-image-product
          python3 scripts/ci/wolf-context-package.py extract \
            --url https://git.alc.xyz --owner alcxyz \
            --channel "$WOLF_CHANNEL" --sha "$SOURCE_SHA" \
            --archive wolf-context.tar.zst --directory wolf-image-product
          jq -e --arg name '${{ matrix.product }}' --arg sha "$SOURCE_SHA" \
            --arg channel "$WOLF_CHANNEL" \
            '.schemaVersion == 1 and .revision == $sha and .channel == $channel and
             (.products | length) == 1 and
             .products[0].name == $name and .products[0].context == "context"' \
            wolf-image-product/manifest.json >/dev/null
          test -d wolf-image-product/context
          jq '.products[].context = "wolf-image-product/context"' \
            wolf-image-product/manifest.json > wolf-image-product/publish-manifest.json

      - name: Log in to the Forgejo registry
        if: github.event.inputs.publish == 'true'
        env:
          WOLF_REGISTRY_TOKEN: ${{ secrets.WOLF_REGISTRY_TOKEN }}
        run: |
          : "${WOLF_REGISTRY_TOKEN:?missing WOLF_REGISTRY_TOKEN}"
          printf '%s' "$WOLF_REGISTRY_TOKEN" \
            | docker login git.alc.xyz -u alcxyz --password-stdin

      - name: Build and optionally publish images
        env:
          PUBLISH: ${{ github.event.inputs.publish == 'true' }}
        run: |
          set -euo pipefail
          builder="wolf-${{ matrix.product }}-${{ forgejo.run_id }}-${{ forgejo.run_attempt }}"
          cleanup() { docker buildx rm --force "$builder" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker buildx create --name "$builder" --driver docker-container \
            --driver-opt cgroup-parent=/forgejobuilds.slice/forgejo-runner-podman.service \
            --driver-opt image=docker.io/moby/buildkit:buildx-stable-1 \
            --driver-opt default-load=true
          export BUILDX_BUILDER="$builder"
          docker buildx inspect --bootstrap >/dev/null
          publish_flag=()
          if [ "$PUBLISH" = true ]; then
            publish_flag=(--push)
          fi
          scripts/ci/publish-wolf-images.sh \
            "${publish_flag[@]}" \
            wolf-image-product/publish-manifest.json \
            "$WOLF_CHANNEL" \
            "$GITHUB_SHA" \
            "published-wolf-${{ matrix.product }}.json"
          jq . "published-wolf-${{ matrix.product }}.json"

      - uses: https://data.forgejo.org/actions/upload-artifact@v3
        if: always()
        with:
          name: wolf-image-reference-${{ matrix.product }}
          path: published-wolf-${{ matrix.product }}.json
          if-no-files-found: error
