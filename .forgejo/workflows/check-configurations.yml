name: Validate configurations
run-name: "Configuration checks (${{ forgejo.event_name }})"

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  configurations:
    name: Validate candidate
    runs-on: forgejo-docker-primary
    timeout-minutes: 60
    concurrency:
      group: configurations-${{ forgejo.event.pull_request.number || forgejo.ref }}
      cancel-in-progress: true
    steps:
      - name: Require a maintainer-owned candidate
        env:
          EVENT: ${{ forgejo.event_name }}
          HEAD_REPOSITORY: ${{ forgejo.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ forgejo.repository }}
        run: |
          if [ "$EVENT" = pull_request ] && [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo 'Validation requires a reviewed maintainer-owned branch.' >&2
            exit 1
          fi

      - name: Require full-validation source access
        if: forgejo.event_name != 'pull_request' || forgejo.event.pull_request.base.ref != 'dev'
        env:
          CI_SOURCE_READ_USER: ${{ secrets.CI_SOURCE_READ_USER }}
          CI_SOURCE_READ_TOKEN: ${{ secrets.CI_SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$CI_SOURCE_READ_USER" ] || [ -z "$CI_SOURCE_READ_TOKEN" ]; then
            echo 'Configuration source access is not provisioned; validation cannot run.' >&2
            exit 1
          fi

      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          github-server-url: https://git.alc.xyz
          ref: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify candidate revision
        env:
          EXPECTED_HEAD: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Install runner prerequisites
        run: |
          apt-get update
          apt-get install -y git python3 sudo udev

      - uses: https://github.com/cachix/install-nix-action@v30
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.1/install
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run lightweight development checks
        if: forgejo.event_name == 'pull_request' && forgejo.event.pull_request.base.ref == 'dev'
        env:
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha }}
        run: |
          # Read only the public toolchain pin; do not evaluate this flake or fetch
          # its private inputs to check formatting and credential-free tests.
          revision=$(python3 - <<'PYTHON'
          import json
          import re
          with open("flake.lock") as source:
              locked = json.load(source)["nodes"]["nixpkgs"]["locked"]
          assert locked["type"] == "github"
          assert (locked["owner"], locked["repo"]) == ("NixOS", "nixpkgs")
          assert re.fullmatch(r"[0-9a-f]{40}", locked["rev"])
          print(locked["rev"])
          PYTHON
          )
          nix shell --no-update-lock-file \
            "github:NixOS/nixpkgs/$revision#treefmt" \
            "github:NixOS/nixpkgs/$revision#alejandra" \
            "github:NixOS/nixpkgs/$revision#shfmt" \
            "github:NixOS/nixpkgs/$revision#shellcheck" \
            "github:NixOS/nixpkgs/$revision#ripgrep" \
            -c bash scripts/ci/check-development.sh "$BASE_SHA"

      - name: Evaluate all systems
        if: forgejo.event_name != 'pull_request' || forgejo.event.pull_request.base.ref != 'dev'
        env:
          CI_SOURCE_READ_TOKEN: ${{ secrets.CI_SOURCE_READ_TOKEN }}
          CI_SOURCE_READ_USER: ${{ secrets.CI_SOURCE_READ_USER }}
        run: |
          bash scripts/ci/with-source-access.sh bash scripts/ci/check-configurations.sh all-systems

      - name: Build and run native checks
        if: forgejo.event_name != 'pull_request' || forgejo.event.pull_request.base.ref != 'dev'
        env:
          CI_SOURCE_READ_TOKEN: ${{ secrets.CI_SOURCE_READ_TOKEN }}
          CI_SOURCE_READ_USER: ${{ secrets.CI_SOURCE_READ_USER }}
        run: |
          bash scripts/ci/with-source-access.sh bash scripts/ci/check-configurations.sh native
          git rev-parse HEAD
          sha256sum flake.lock
