name: Refresh nix-packages lock
run-name: "nix-packages lock refresh (${{ forgejo.event_name }})"

on:
  schedule:
    # Poll after the package merge window. The update script refuses promotion
    # while any package update PR remains open, so concurrent validation cannot
    # produce a partially advanced lock.
    - cron: "TZ=Europe/Oslo 0 6-9 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Build, verify, and publish current packages
    runs-on: ubuntu-latest
    concurrency:
      group: nix-packages-lock-update
      cancel-in-progress: false
    env:
      BASE_BRANCH: dev
      # This opts the verifier into cleaning Nix's fake HOME. The guard in the
      # script also requires Docker's container marker before removing it.
      NIX_CI_EPHEMERAL_CONTAINER: "1"

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          github-server-url: https://git.alc.xyz
          ref: dev
          persist-credentials: false

      - name: Install runner prerequisites
        run: |
          apt-get update
          apt-get install -y jq sudo udev

      - uses: https://github.com/cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Refresh and verify nix-packages
        id: update
        env:
          CI_SOURCE_READ_TOKEN: ${{ secrets.CI_SOURCE_READ_TOKEN }}
          CI_SOURCE_READ_USER: ${{ secrets.CI_SOURCE_READ_USER }}
        run: |
          bash scripts/ci/with-source-access.sh bash scripts/update-inputs/update-nix-packages.sh
          git rev-parse HEAD
          sha256sum flake.lock

      - name: Publish verified lock update
        if: steps.update.outputs.updated == 'true'
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: https://git.alc.xyz
          FORGEJO_OWNER: alcxyz
          FORGEJO_REPO: nix-config
          REVISION: ${{ steps.update.outputs.revision }}
          CI_SOURCE_READ_TOKEN: ${{ secrets.CI_SOURCE_READ_TOKEN }}
          CI_SOURCE_READ_USER: ${{ secrets.CI_SOURCE_READ_USER }}
        run: |
          bash scripts/ci/with-source-access.sh bash scripts/forgejo/publish-nix-packages-lock.sh
          git rev-parse HEAD
          sha256sum flake.lock
