name: Refresh DMS plugins lock
run-name: "DMS plugins lock refresh (${{ forgejo.event_name }})"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    name: Build, verify, and merge current DMS plugins
    runs-on: ubuntu-latest
    concurrency:
      group: dms-plugins-lock-update
      cancel-in-progress: false
    env:
      BASE_BRANCH: dev
      UPDATE_BRANCH: update/dms-plugins-lock

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          github-server-url: https://git.alc.xyz
          ref: dev

      - name: Install runner prerequisites
        run: |
          apt-get update
          apt-get install -y jq sudo

      - uses: https://github.com/cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Refresh and verify DMS plugins
        id: update
        run: scripts/update-inputs/update-dms-plugins.sh

      - name: Publish and merge verified lock update
        if: steps.update.outputs.updated == 'true'
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: https://git.alc.xyz
          FORGEJO_OWNER: alcxyz
          FORGEJO_REPO: nix-config
          REVISION: ${{ steps.update.outputs.revision }}
          VERSION: ${{ steps.update.outputs.version }}
        run: scripts/forgejo/publish-dms-plugins-lock.sh
