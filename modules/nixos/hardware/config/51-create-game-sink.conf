{
  "context.spa-libs": {
    "support.null-audio-sink": "audioconvert/libspa-audioconvert" // Or "support/libspa-support" if that's where null-audio-sink lives
  },
  "context.modules": [
    {
      "name": "libpipewire-module-spa-node-factory",
      "args": {
        "factory.name": "support.null-audio-sink",
        "node.name": "GameAudioSink",
        "node.description": "Virtual_Sink_for_Games",
        "media.class": "Audio/Sink",
        "audio.channels": 2,
        "audio.position": "FL,FR"
        // "node.passive": true, // Might be useful for virtual devices
        // "node.autoconnect": false // Usually false for virtual sinks
      }
    }
  ]
}
