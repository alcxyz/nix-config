# Sunshine Configuration for Gaming Workspace
min_log_level = info
file_apps = /home/@username@/.config/sunshine/apps.json # Points to your managed apps list

# Display and capture settings
# adapter_name = # Usually auto-detected. Fill if specific GPU needed and auto-detection fails.
# output_name =  # Usually auto-detected. Fill if specific monitor needed for capture.
fps = [10, 30, 60, 75, 90, 120] # Added more common refresh rates
resolutions = [
    # Standard resolutions
    # 640x480, # Optional: if very low res needed
    1280x720,
    1920x1080,
    2560x1440,
    3840x2160,
    # Ultrawide examples (optional, add if you use them)
    # 2560x1080,
    # 3440x1440
]

# Encoder settings for NVIDIA
encoder = nvenc
# nvenc_preset: p1 (fastest, lowest quality) to p7 (slowest, highest quality). p4-p5 recommended for balance.
nvenc_preset = p5
nvenc_tune = ll # Low Latency
nvenc_rc = cbr # Constant Bit Rate. Consider "vbr" if your network is stable for potentially better quality.
nvenc_bitrate_kbps = 60000 # Example: 30 Mbps for 1080p60. Adjust as needed. Only for CBR/VBR.
# nvenc_max_bitrate_kbps = 50000 # Example: Only for VBR.
nvenc_coder = auto # CABAC/CAVLC

# Audio settings
audio_backend = pipewire # Explicitly set for clarity, though auto-detect usually works.
audio_sink = GameAudioSink # Name of your PipeWire null-sink.

# Input settings
key_repeat_delay = 500
key_repeat_frequency = 24

# Network settings
channels = 2 # Stereo
port = 47989
origin_web_ui_allowed = pc # Allow Web UI access from private/local networks
upnp = on # Enable UPnP for automatic port forwarding if router supports it

# Authentication
# Set username and password via Web UI or sunshine_cli after first run
# username = @username@ # This will be set by your NixOS script
# password = # Leave blank, set via UI

# Logging and State
file_state = /home/@username@/.config/sunshine/sunshine_state.json
