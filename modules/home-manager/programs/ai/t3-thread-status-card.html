<!doctype html>
<html><head><meta charset="utf-8">
<!-- T3 thread status card (ADR-0091). t3-thread-status-render replaces the
     JSON between the REPORT markers with one thread's t3-thread-status facts
     and the reporting agent's notes; the page escapes everything it shows. -->
<style>
  body { font-family: var(--font-sans); color: var(--foreground); margin: 0; }
  .card { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 8px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .verdict { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; color: var(--background); }
  .title { font-weight: 600; font-size: 15px; color: var(--foreground); text-decoration: none; flex: 1; min-width: 0; }
  .title:hover { text-decoration: underline; }
  .meta { font-size: 12px; color: var(--muted-foreground); }
  .summary { font-size: 13.5px; line-height: 1.45; }
  .reasons { font-size: 12.5px; color: var(--destructive); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { padding: 5px 6px; border-top: 1px solid var(--border); vertical-align: top; }
  td.mark { width: 22px; text-align: center; font-weight: 700; }
  td.detail { color: var(--muted-foreground); font-size: 12.5px; }
  .pass { color: var(--success); }
  .fail { color: var(--destructive); }
  .na { color: var(--muted-foreground); }
  h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted-foreground); }
  ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.45; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .owner { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  .owner.user { background: var(--warning-surface); color: var(--warning); }
  .owner.agent { background: var(--accent-surface); color: var(--accent-surface-foreground); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--secondary); color: var(--secondary-foreground); text-decoration: none; }
  .note { font-size: 11.5px; color: var(--muted-foreground); }
  @media (max-width: 600px) { .cols { grid-template-columns: 1fr; } }
</style></head>
<body>
<div id="app"></div>
<script>
const REPORT =
/*REPORT-START*/
{
  "generatedAt": "2026-10-11T12:00:00Z",
  "verdict": "not-yet",
  "summary": "Sample: the change is merged; the deploy is still to do.",
  "remaining": ["Deploy to the fleet"],
  "owner": "user",
  "leftForYou": ["Run deploy --all"],
  "thread": {
    "threadId": "sample-1", "project": "example", "title": "Sample thread", "state": "unsettled",
    "run": {"status": "completed", "active": false}, "idleMinutes": 95, "self": false,
    "settle": {"verdict": "not-yet", "line": "not yet: deploy, user", "stale": false},
    "stallReasons": [],
    "worktree": {"branch": "feat/sample", "exists": true},
    "prs": [{"url": "https://example.invalid/pulls/1", "number": 1, "state": "merged", "watched": false}],
    "checks": [
      {"id": "run", "label": "Latest run ended cleanly", "pass": true, "detail": "completed"},
      {"id": "clean", "label": "No uncommitted changes", "pass": false, "detail": "1 changed, 0 untracked"},
      {"id": "settle", "label": "Agent reported Settle: ready", "pass": null, "detail": "no Settle: line"}
    ]
  }
}
/*REPORT-END*/
;
const VERDICTS = {
  "ready":   { label: "Ready to settle", color: "var(--success)" },
  "not-yet": { label: "Not yet",         color: "var(--warning)" },
  "waiting": { label: "Waiting",         color: "var(--info)" },
  "stalled": { label: "Stalled",         color: "var(--destructive)" },
  "done":    { label: "Settled · done",  color: "var(--muted-foreground)" },
  "left-for-you": { label: "Settled · left for you", color: "var(--warning)" },
  "check":   { label: "Settled · check", color: "var(--destructive)" },
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t = REPORT.thread;
const v = VERDICTS[REPORT.verdict] || { label: String(REPORT.verdict || "unknown"), color: "var(--muted-foreground)" };
function idle(m) {
  if (!Number.isFinite(m)) return "";
  if (m < 60) return `idle ${m}m`;
  if (m < 2880) return `idle ${Math.floor(m / 60)}h`;
  return `idle ${Math.floor(m / 1440)}d`;
}
const mark = p => (p === true ? `<td class="mark pass">✓</td>` : p === false ? `<td class="mark fail">✗</td>` : `<td class="mark na">·</td>`);
const list = xs => (xs && xs.length ? `<ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<ul><li>Nothing</li></ul>`);
const owner = REPORT.owner === "agent" || REPORT.owner === "user"
  ? `<span class="owner ${REPORT.owner}">${REPORT.owner === "agent" ? "Agent" : "You"}</span>` : "";
const w = t.worktree || {};
const moved = w.head && w.branch && w.head !== w.branch ? `worktree on ${w.head}` : "";
const meta = [t.project, w.branch, moved, t.run && t.run.status, idle(t.idleMinutes)].filter(Boolean).map(esc).join(" · ");
const prs = (t.prs || []).map(p => `<a class="chip" href="${esc(p.url)}">PR ${esc(p.number)} ${esc(p.state || "unknown")}${p.watched ? " · watched" : ""}</a>`).join("");
document.getElementById("app").innerHTML = `<div class="card">
  <div class="top">
    <span class="verdict" style="background:${v.color}">${esc(v.label)}</span>
    <a class="title" href="t3-thread://v1/${esc(t.threadId)}">${esc(t.title)}</a>
  </div>
  <div class="meta">${meta}</div>
  ${REPORT.summary ? `<div class="summary">${esc(REPORT.summary)}</div>` : ""}
  ${(t.stallReasons || []).length ? `<div class="reasons">Never handed off: ${esc(t.stallReasons.join(", "))}</div>` : ""}
  ${prs ? `<div class="chips">${prs}</div>` : ""}
  <table>${(t.checks || []).map(c => `<tr>${mark(c.pass)}<td>${esc(c.label)}</td><td class="detail">${esc(c.detail)}</td></tr>`).join("")}</table>
  <div class="cols">
    <div><h4>Remaining${owner}</h4>${list(REPORT.remaining)}</div>
    <div><h4>Left for you</h4>${list(REPORT.leftForYou)}</div>
  </div>
  <div class="note">Checks from t3-thread-status at ${esc(String(REPORT.generatedAt || "").slice(0, 16).replace("T", " "))} UTC${t.self ? "; reported by the thread itself" : ""}.</div>
</div>`;
</script>
</body></html>
