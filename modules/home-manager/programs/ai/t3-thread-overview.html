<!doctype html>
<html><head><meta charset="utf-8">
<!-- T3 thread overview (ADR-0091). t3-thread-overview-render writes one copy
     of this page per section, replacing the JSON between the REPORT markers
     with that section's threads, already grouped. -->
<style>
  body { font-family: var(--font-sans); color: var(--foreground); margin: 0; }
  .wrap { display: flex; flex-direction: column; gap: 14px; padding: 4px 0 8px; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .kpi { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; }
  .kpi .n { font-size: 20px; font-weight: 650; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 11.5px; color: var(--muted-foreground); margin-top: 2px; }
  .kpi.warn .n { color: var(--warning); } .kpi.ok .n { color: var(--success); }
  .kpi.info .n { color: var(--info); } .kpi.bad .n { color: var(--destructive); }
  h2 { font-size: 14px; font-weight: 650; margin: 0; display: flex; align-items: center; gap: 8px; }
  h3 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted-foreground); margin: 4px 0 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .phasebar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 11.5px; color: var(--muted-foreground); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .ackrow { display: flex; gap: 8px; align-items: flex-start; }
  .ackrow > input { margin-top: 12px; accent-color: var(--success); }
  .ackrow > details { flex: 1; min-width: 0; }
  details.row { border: 1px solid var(--border); border-radius: var(--radius); }
  details.row > summary { list-style: none; cursor: pointer; padding: 8px 12px; display: flex; flex-direction: column; gap: 3px; }
  details.row > summary::-webkit-details-marker { display: none; }
  details.row[open] > summary { border-bottom: 1px solid var(--border); }
  .l1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .title { font-weight: 600; font-size: 13.5px; color: var(--foreground); text-decoration: none; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title:hover { text-decoration: underline; }
  .l2 { font-size: 12.5px; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini { width: 44px; height: 5px; border-radius: 3px; background: var(--muted); overflow: hidden; flex: none; }
  .mini i { display: block; height: 100%; }
  .pct { font-size: 11px; font-variant-numeric: tabular-nums; width: 30px; text-align: right; color: var(--muted-foreground); flex: none; }
  .body { padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; line-height: 1.45; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: var(--secondary); color: var(--secondary-foreground); text-decoration: none; white-space: nowrap; flex: none; }
  .chip.phase, .chip.live, .chip.ready, .chip.stalled { color: var(--background); font-weight: 600; }
  .chip.live { background: var(--info); } .chip.ready { background: var(--success); } .chip.stalled { background: var(--destructive); }
  .owner { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 0 5px; border-radius: 4px; margin-right: 6px; }
  .owner.user { background: var(--warning-surface); color: var(--warning); }
  .owner.agent { background: var(--accent-surface); color: var(--accent-surface-foreground); }
  .goal, .settle, .meta { color: var(--muted-foreground); }
  .blocker { color: var(--destructive); }
  .flag { color: var(--muted-foreground); font-style: italic; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; color: var(--muted-foreground); }
  .cols h4 { margin: 2px 0 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--foreground); }
  .cols ul { margin: 2px 0 0; padding-left: 16px; }
  .ackbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground); }
  .ackbar code { flex: 1 1 260px; min-width: 0; font-size: 11.5px; padding: 6px 8px; border-radius: var(--radius); background: var(--code-background); color: var(--code-foreground); overflow-wrap: anywhere; user-select: all; }
  .ackbar button { font: inherit; padding: 4px 10px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--primary); color: var(--primary-foreground); cursor: pointer; }
  .ackbar button:disabled { opacity: .5; cursor: default; }
  details.done > summary { cursor: pointer; font-size: 12.5px; color: var(--muted-foreground); }
  .donelist { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
  .donelist a { color: var(--foreground); text-decoration: none; }
  .donelist a:hover { text-decoration: underline; }
  .why { color: var(--muted-foreground); font-size: 11.5px; margin-left: 6px; }
  .note, .empty { font-size: 11.5px; color: var(--muted-foreground); }
  @media (max-width: 600px) {
    .kpis { grid-template-columns: repeat(3, 1fr); }
    .cols { grid-template-columns: 1fr; }
    .mini { display: none; }
  }
</style></head>
<body>
<div class="wrap" id="app"></div>
<script>
const REPORT =
/*REPORT-START*/
{
  "generatedAt": "2026-10-10T01:00:00Z",
  "windowDays": 3,
  "source": "sample data",
  "readerModel": "light role",
  "environmentId": "sample-environment",
  "section": {"key": "settled", "title": "Settled in the last 3 days"},
  "summary": {"unsettled": 1, "user": 1, "agent": 0, "stalled": 0, "settle": 0, "settledOpen": 1, "avgPct": 60, "phases": {"awaiting-user": 1}},
  "footer": true,
  "threads": [
    {"threadId": "sample-1", "title": "Sample settled thread", "project": "example", "bucket": "recently-settled",
     "status": "completed", "updatedAt": "2026-10-09T10:00:00Z", "settledAt": "2026-10-09T10:00:00Z", "prs": [],
     "progressPct": 80, "phase": "done-not-settled", "owner": "user", "group": "settled-open",
     "nextAction": "Reopen to finish the follow-up.", "blocker": null, "flag": null, "waitingOn": [],
     "done": ["Main change merged"], "remaining": ["Deploy"], "verdict": "follow-up", "verdictReason": "Merged but never deployed."},
    {"threadId": "sample-2", "title": "Sample thread confirmed done", "project": "example", "bucket": "recently-settled",
     "status": "completed", "updatedAt": "2026-10-09T12:00:00Z", "settledAt": "2026-10-09T12:00:00Z", "prs": [],
     "group": "settled-done", "acknowledged": true, "waitingOn": []}
  ]
}
/*REPORT-END*/
;
const PHASES = {
  "blocked":          { label: "Blocked",            color: "var(--destructive)" },
  "awaiting-user":    { label: "Awaiting you",       color: "var(--warning)" },
  "exploring":        { label: "Exploring",          color: "var(--chart-5)" },
  "planning":         { label: "Planning",           color: "var(--chart-4)" },
  "implementing":     { label: "Implementing",       color: "var(--info)" },
  "reviewing":        { label: "Reviewing",          color: "var(--chart-2)" },
  "done-not-settled": { label: "Done · not settled", color: "var(--success)" },
};
// What the user has to do next, from the reader's actionKind.
const ACTIONS = [
  ["decide", "Decide or answer"],
  ["deploy", "Deploy or verify"],
  ["review", "Review or merge"],
  ["unblock", "Sign in or unblock"],
  ["other", "Other"],
];
const SECTION_COLORS = { you: "var(--warning)", stalled: "var(--destructive)", settle: "var(--success)", settled: "var(--destructive)", agent: "var(--info)" };
const LIVE = new Set(["running", "starting", "queued", "preparing", "waiting"]);
const NOW = new Date(REPORT.generatedAt);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// T3 forwards only http(s) clicks out of a rendered page, so t3-thread://
// links do nothing here. Until it does, link to the thread's route on the T3
// server that serves this page, which T3 opens in a browser tab or its
// preview pane.
const APP = (() => {
  try {
    const here = new URL(location.href);
    return /^https?:$/.test(here.protocol) && typeof REPORT.environmentId === "string" ? here.origin : null;
  } catch { return null; }
})();
const link = t => (APP ? `${APP}/${encodeURIComponent(REPORT.environmentId)}/${encodeURIComponent(t.threadId)}` : `t3-thread://v1/${t.threadId}`);
const said = t => (t.facts?.settle && !t.facts.settle.stale ? t.facts.settle : null);
const leftOf = t => t.facts?.settle?.leftForYou || null;
const phaseOf = t => PHASES[t.phase] || { label: t.phase || "unknown", color: "var(--muted-foreground)" };
const num = v => (Number.isFinite(Number(v)) && v !== null && v !== "" ? Number(v) : null);
function ago(iso) {
  if (!iso) return "";
  const h = (NOW - new Date(iso)) / 3.6e6;
  if (h < 1) return Math.max(1, Math.round(h * 60)) + "m ago";
  if (h < 24) return Math.round(h) + "h ago";
  return Math.round(h / 24) + "d ago";
}
const sec = REPORT.section || { key: "summary", title: "T3 threads" };
const threads = REPORT.threads.map(t => ({ ...t, progressPct: num(t.progressPct) }));
const order = t => (t.phase === "blocked" ? 0 : 1) * 1000 - (t.progressPct || 0);
const parts = [];

const S = REPORT.summary;
if (S) {
  parts.push(`<div class="kpis">
    <div class="kpi"><div class="n">${num(S.unsettled) ?? 0}</div><div class="l">unsettled</div></div>
    <div class="kpi warn"><div class="n">${num(S.user) ?? 0}</div><div class="l">waiting on you</div></div>
    <div class="kpi bad"><div class="n">${num(S.stalled) ?? 0}</div><div class="l">stalled</div></div>
    <div class="kpi ok"><div class="n">${num(S.settle) ?? 0}</div><div class="l">ready to settle</div></div>
    <div class="kpi bad"><div class="n">${num(S.settledOpen) ?? 0}</div><div class="l">settled, maybe not done</div></div>
    <div class="kpi info"><div class="n">${num(S.agent) ?? 0}</div><div class="l">agent side</div></div>
  </div>`);
  const counts = Object.keys(PHASES).map(p => [p, num(S.phases?.[p]) || 0]).filter(([, c]) => c);
  if (counts.length) parts.push(`<div>
    <div class="phasebar">${counts.map(([p, c]) => `<div title="${PHASES[p].label}: ${c}" style="flex:${c};background:${PHASES[p].color}"></div>`).join("")}</div>
    <div class="legend">${counts.map(([p, c]) => `<span><i style="background:${PHASES[p].color}"></i>${PHASES[p].label} ${c}</span>`).join("")}<span>avg ${num(S.avgPct) ?? "?"}% complete</span></div>
  </div>`);
}

function row(t) {
  const ph = phaseOf(t);
  const owner = t.owner === "agent" ? "agent" : "user";
  const stalled = t.facts?.verdict === "stalled";
  const next = t.nextAction || leftOf(t) || "";
  const prs = (t.prs || []).filter(p => p.state === "open");
  const chips = [
    `<span class="chip phase" style="background:${ph.color}">${esc(ph.label)}</span>`,
    LIVE.has(t.status) ? `<span class="chip live">${esc(t.status)}</span>` : "",
    ...(t.waitingOn || []).map(w => `<span class="chip${w.kind === "command" ? "" : " live"}">${w.kind === "command" ? "background" : "waiting"}: ${esc(w.description || w.kind)}</span>`),
    ...prs.map(p => `<a class="chip" href="${esc(p.url)}">open PR ${esc(String(p.url || "").split("/").pop())}</a>`),
    said(t)?.verdict === "ready" ? `<span class="chip ready">Settle: ready</span>` : "",
    stalled ? `<span class="chip stalled">stalled: ${esc((t.facts.stallReasons || []).join(", ") || "check")}</span>` : "",
  ].join("");
  const list = xs => (xs && xs.length ? `<ul>${xs.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : `<ul><li>Nothing</li></ul>`);
  const when = t.bucket === "recently-settled" ? `settled ${ago(t.settledAt)}` : `updated ${ago(t.updatedAt)}`;
  const pct = t.progressPct;
  return `<details class="row"><summary>
      <div class="l1"><a class="title" href="${link(t)}">${esc(t.title)}</a>
        ${stalled ? `<span class="chip stalled">stalled</span>` : ""}
        ${LIVE.has(t.status) ? `<span class="chip live">${esc(t.status)}</span>` : ""}
        <span class="chip">${esc(t.project)}</span>
        <span class="mini"><i style="width:${pct || 0}%;background:${ph.color}"></i></span><span class="pct">${pct ?? "?"}%</span></div>
      <div class="l2"><span class="owner ${owner}">${owner === "agent" ? "Agent" : "You"}</span>${esc(next)}</div>
    </summary><div class="body">
      ${t.goal ? `<div class="goal">${esc(t.goal)}</div>` : ""}
      <div class="chips">${chips}</div>
      ${next ? `<div><span class="owner ${owner}">Next</span>${esc(next)}</div>` : ""}
      ${t.verdictReason ? `<div class="blocker">↺ ${esc(t.verdictReason)}</div>` : ""}
      ${said(t) ? `<div class="settle">Thread says: Settle: ${esc(said(t).line)}</div>` : ""}
      ${said(t) && leftOf(t) && leftOf(t) !== next ? `<div class="settle">Left for you: ${esc(leftOf(t))}</div>` : ""}
      ${t.blocker ? `<div class="blocker">⚠ ${esc(t.blocker)}</div>` : ""}
      ${t.flag ? `<div class="flag">${esc(t.flag)}</div>` : ""}
      <div class="cols"><div><h4>Done</h4>${list(t.done)}</div><div><h4>Remaining</h4>${list(t.remaining)}</div></div>
      <div class="meta">${esc(when)}</div>
    </div></details>`;
}
const rows = ts => `<div class="rows">${ts.slice().sort((a, b) => order(a) - order(b)).map(row).join("")}</div>`;
const sub = (label, ts) => (ts.length ? `<h3>${esc(label)} · ${ts.length}</h3>${rows(ts)}` : "");
const inGroup = g => threads.filter(t => t.group === g);

if (sec.key !== "summary") parts.push(`<h2><span class="dot" style="background:${SECTION_COLORS[sec.key] || "var(--muted-foreground)"}"></span>${esc(sec.title)} · ${threads.length}</h2>`);
if (sec.key === "you") {
  const known = new Set(ACTIONS.map(([k]) => k));
  for (const [key, label] of ACTIONS)
    parts.push(sub(label, threads.filter(t => (known.has(t.actionKind) ? t.actionKind : "other") === key)));
} else if (sec.key === "agent") {
  parts.push(sub("Can continue, needs a nudge", inGroup("agent")));
  parts.push(sub("Working or waiting on background work, do not settle", inGroup("waiting")));
} else if (sec.key === "settled") {
  const open = inGroup("settled-open");
  const done = inGroup("settled-done");
  if (open.length) {
    // The frame cannot change anything: a ticked thread only goes into a
    // command the user runs, which records it as done for later overviews.
    parts.push(`<h3>Maybe not done · ${open.length}</h3>
      <div class="ackbar"><span>Tick the ones you accept as done, then run:</span>
        <code id="ackcmd">nothing ticked yet</code><button id="ackcopy" type="button" disabled>Copy</button></div>
      <div class="rows">${open.slice().sort((a, b) => order(a) - order(b)).map(t =>
        `<div class="ackrow"><input type="checkbox" class="ack" title="Accept as done" data-ack="${esc(t.threadId + "@" + (t.settledAt || ""))}">${row(t)}</div>`).join("")}</div>`);
  }
  if (done.length) {
    parts.push(`<details class="done"${open.length ? "" : " open"}><summary>Confirmed done · ${done.length}</summary>
      <ul class="donelist">${done.map(t => `<li><a href="${link(t)}">${esc(t.title)}</a><span class="why">${esc(t.project)} · settled ${ago(t.settledAt)} · ${
        t.acknowledged ? "you marked it done" : t.verdictReason ? esc(t.verdictReason) : t.facts?.verdict === "done" ? "facts agree with its Settle: ready" : "reader found nothing left"}</span></li>`).join("")}</ul>
    </details>`);
  }
} else if (sec.key !== "summary") {
  parts.push(rows(threads));
}
if (!threads.length && sec.key === "summary") parts.push(`<div class="empty">No unsettled or recently settled threads.</div>`);
if (REPORT.footer) parts.push(`<div class="note">Inventory: ${esc(REPORT.source)}. Progress and verdicts are estimates by ${esc(REPORT.readerModel)} readers from each thread's opening and latest messages; a thread's own Settle: line and t3-thread-status facts take precedence. Generated ${esc(String(REPORT.generatedAt).slice(0, 16).replace("T", " "))} UTC.</div>`);

const app = document.getElementById("app");
app.innerHTML = parts.join("");
const cmd = document.getElementById("ackcmd");
const copy = document.getElementById("ackcopy");
if (cmd && copy) {
  // The command is pasted into a shell, so only T3's ID and timestamp characters pass.
  const picked = () => [...app.querySelectorAll("input.ack:checked")].map(i => i.dataset.ack)
    .filter(a => /^[A-Za-z0-9:%._-]+@[0-9][0-9T:.Z-]*$/.test(a));
  app.addEventListener("change", () => {
    const ids = picked();
    cmd.textContent = ids.length ? `t3-thread-overview-ack ${ids.join(" ")}` : "nothing ticked yet";
    copy.disabled = !ids.length;
    copy.textContent = "Copy";
  });
  // The frame may not allow the clipboard; then the command is selected for Ctrl+C.
  copy.addEventListener("click", () => {
    const select = () => { const r = document.createRange(); r.selectNodeContents(cmd); getSelection().removeAllRanges(); getSelection().addRange(r); copy.textContent = "Selected, press Ctrl+C"; };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(cmd.textContent).then(() => { copy.textContent = "Copied"; }, select);
    else select();
  });
}
</script>
</body></html>
