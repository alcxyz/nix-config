# Sources
source = ~/.config/hypr/colors.conf
#source = ~/.config/hypr/gaming.conf

# Single 49" ultrawide, let EDID choose preferred
#monitor=,preferred,auto,auto
monitor=DP-1, 5120x1440, 0x0, 1

exec-once = exec ~/.config/hypr/launch
# If you want waybar launched directly:
exec-once = exec ~/.config/waybar/launch.sh

debug:full_cm_proto = true

# Environment for NVIDIA Wayland stack (keep if still on NVIDIA)
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

input {
  kb_layout = us,no
  kb_options = grp:alt_shift_toggle
  numlock_by_default = true

  follow_mouse = 2

  touchpad {
    natural_scroll = yes
  }

  sensitivity = 1.0
}

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 1 
  allow_tearing = true
  no_focus_fallback = false
}

decoration {
  rounding = 5
  active_opacity = 1.0
  inactive_opacity = 1.0
}

animations {
  enabled = false
}

dwindle {
  pseudotile = false
  preserve_split = false
  use_active_for_splits = yes
}

# Master layout tuned for ultrawide "columns-first"
master {
  mfact = 0.5
  orientation = left
  special_scale_factor = 0.9
}

plugin {
    hyprscrolling {
        column_width = 0.5
        fullscreen_on_one_column = false
        focus_fit_method = 0
        follow_focus = true
        explicit_column_widths = 0.25,0.5,0.75,1.0
    }
}

# App aliases
$scripts = ~/.config/hypr/scripts
$term = foot
$file = nautilus
$mail = thunderbird
$lock = hyprlock
$zen = zen
$wofi = wofi-intelligent-runner
$screenshot = screenshot
$screenshot_edit = screenshot-edit

# =========================
# CORE PHILOSOPHY BINDINGS
# =========================

# HELP & SESSION
#bind = SUPER SHIFT, slash, hyprexpo:toggle
bind = SUPER SHIFT, escape, exit
bind = SUPER SHIFT, Q, exec, $lock
bind = SUPER, BACKSPACE, exec, wlogout -b 1 -p layer-shell

# QUICK ACCESS (Alt prefix)
bind = ALT, SPACE, exec, $term
bind = ALT, RETURN, exec, $term
bind = ALT, S, exec, $wofi
# scratchpad via special workspace (ndrop-like)
bind = SUPER+ALT, ESCAPE, movetoworkspacesilent, special
bind = SUPER, ESCAPE, togglespecialworkspace

# APPLICATIONS (Mod + single letters)
bind = SUPER, B, exec, $zen
bind = SUPER, V, exec, $zen --no-remote -profile /home/alc/.zen/media
bind = SUPER, X, exec, $zen --no-remote -profile /home/alc/.zen/xyz
bind = SUPER, G, exec, $mail
bind = SUPER, F, exec, $file

# WINDOW MANAGEMENT
bind = SUPER, W, killactive,
bind = SUPER, T, togglefloating,
bind = SUPER, RETURN, fullscreen,
# Overview toggle (adjust if using a different plugin)
#bind = SUPER, O, hyprexpo:toggle

# PRIMARY NAVIGATION (Mod alone)
# Columns left/right
bind = SUPER, H, movefocus, l
bind = SUPER, L, movefocus, r
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r

# Workspaces up/down (vertical dimension)
bind = SUPER, J, workspace, r-1
bind = SUPER, K, workspace, r+1
bind = SUPER, down, workspace, r-1
bind = SUPER, up, workspace, r+1

# Workspace previous
bind = SUPER, TAB, workspace, previous
bind = ALT, Tab, movefocus, d

# Focus extremes (first/last column approximation)
#bind = SUPER, N, focusedge, l
#bind = SUPER, period, focusedge, r

# PRIMARY MOVE (Mod+Shift)
bind = SUPER SHIFT, H, movewindow, l
bind = SUPER SHIFT, L, movewindow, r
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r

# Move column (window) to workspace up/down
bind = SUPER SHIFT, J, movetoworkspace, r-1
bind = SUPER SHIFT, K, movetoworkspace, r+1
bind = SUPER SHIFT, down, movetoworkspace, r-1
bind = SUPER SHIFT, up, movetoworkspace, r+1

# FINE CONTROL / EXTREMES (Mod+Ctrl)
#bind = SUPER CTRL, N, movewindowedge, l
#bind = SUPER CTRL, period, movewindowedge, r

# Focus window up/down in stack
bind = SUPER CTRL, J, movefocus, u
bind = SUPER CTRL, K, movefocus, d

# Consume/expel approximations
bind = SUPER CTRL, Y, swapnext
#bind = SUPER CTRL, U, swapprev

# Switch preset column widths (25/50/75) via script
bind = SUPER CTRL, comma, exec, $scripts/cycle_mfact.sh

# Center-ish rebalance
bind = SUPER, M, togglesplit
#bind = SUPER, S,pseudo

# RESIZE/ADJUST (Mod+Alt)
# Adjust column width by ~5% via resizing active client horizontally
binde = SUPER ALT, H, resizeactive, -50 0
binde = SUPER ALT, L, resizeactive, 50 0
binde = SUPER ALT, left, resizeactive, -50 0
binde = SUPER ALT, right, resizeactive, 50 0

# === F-keys with double-tap handler (restored) ===
bind = , F1, exec, ~/.config/hypr/scripts/fkey_handler.sh F1 1
bind = , F2, exec, ~/.config/hypr/scripts/fkey_handler.sh F2 2
bind = , F3, exec, ~/.config/hypr/scripts/fkey_handler.sh F3 3
bind = , F4, exec, ~/.config/hypr/scripts/fkey_handler.sh F4 4
bind = , F5, exec, ~/.config/hypr/scripts/fkey_handler.sh F5 5
bind = , F6, exec, ~/.config/hypr/scripts/fkey_handler.sh F6 6

# Raw F-keys passthrough with Alt (unchanged)
bindr = ALT, F1, exec, wtype -k F1
bindr = ALT, F2, exec, wtype -k F2
bindr = ALT, F3, exec, wtype -k F3
bindr = ALT, F4, exec, wtype -k F4
bindr = ALT, F5, exec, wtype -k F5
bindr = ALT, F6, exec, wtype -k F6

# SYSTEM ACTIONS
bind = SUPER SHIFT, N, exec, swaync-client -t -sw
bind = SUPER SHIFT, C, exec, wallpaper
bind = SUPER SHIFT, R, exec, pkill waybar || ~/.config/waybar/launch.sh

# MEDIA & SCREENSHOTS
bind = , print, exec, $screenshot
bind = SUPER, print, exec, $screenshot_edit

bindl = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

binde = , F10, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
binde = , F9, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , F8, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# MOUSE INTEGRATION (vertical wheel only)
# Column navigation (primary)
bind = SUPER, mouse_up, movefocus, l
bind = SUPER, mouse_down, movefocus, r

# Workspace navigation (fine control)
bind = SUPER CTRL, mouse_up, workspace, r+1
bind = SUPER CTRL, mouse_down, workspace, r-1

# Column width resize (properties)
binde = SUPER ALT, mouse_up, resizeactive, -50 0
binde = SUPER ALT, mouse_down, resizeactive, 50 0

# Move column to workspace (transfer)
bind = SUPER SHIFT, mouse_up, movetoworkspace, r+1
bind = SUPER SHIFT, mouse_down, movetoworkspace, r-1

# Move/Resize with mouse (hold Mod)
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# WORKSPACE DIRECT ACCESS (numbers kept)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# MOVE TO NUMBERED WORKSPACES
bind = SUPER CTRL, 1, movetoworkspace, 1
bind = SUPER CTRL, 2, movetoworkspace, 2
bind = SUPER CTRL, 3, movetoworkspace, 3
bind = SUPER CTRL, 4, movetoworkspace, 4
bind = SUPER CTRL, 5, movetoworkspace, 5
bind = SUPER CTRL, 6, movetoworkspace, 6
bind = SUPER CTRL, 7, movetoworkspace, 7
bind = SUPER CTRL, 8, movetoworkspace, 8
bind = SUPER CTRL, 9, movetoworkspace, 9
bind = SUPER CTRL, 0, movetoworkspace, 10

## OPACITY RULES (match your Niri)
##windowrulev2 = opacity 0.90 0.90,class:^(Thunderbird)$
#windowrulev2 = opacity 0.80 0.80,class:^(foot)$
#windowrulev2 = opacity 0.80 0.80,class:^(wezterm)$
#
## Xwayland video bridge hides
#windowrulev2 = opacity 0.0 override 0.0 override,class:^(xwaylandvideobridge)$
#windowrulev2 = noanim,class:^(xwaylandvideobridge)$
#windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$
#windowrulev2 = maxsize 1 1,class:^(xwaylandvideobridge)$
#windowrulev2 = noblur,class:^(xwaylandvideobridge)$

# Gaming misc
misc {
  force_default_wallpaper = 0
  disable_hyprland_logo = true
  vrr = 2
}

# Screenshots (your original keycodes kept)
bind = , code:107, exec, $screenshot
bind = SUPER, code:107, exec, $screenshot_edit

# Silent move variants
# Vertical to adjacent workspaces silently
bind = SUPER ALT, J, movetoworkspacesilent, r-1
bind = SUPER ALT, K, movetoworkspacesilent, r+1
bind = SUPER ALT, down, movetoworkspacesilent, r-1
bind = SUPER ALT, up, movetoworkspacesilent, r+1

# Silent move to numbered workspaces (Super+Alt+[0-9])
bind = SUPER ALT, 1, movetoworkspacesilent, 1
bind = SUPER ALT, 2, movetoworkspacesilent, 2
bind = SUPER ALT, 3, movetoworkspacesilent, 3
bind = SUPER ALT, 4, movetoworkspacesilent, 4
bind = SUPER ALT, 5, movetoworkspacesilent, 5
bind = SUPER ALT, 6, movetoworkspacesilent, 6
bind = SUPER ALT, 7, movetoworkspacesilent, 7
bind = SUPER ALT, 8, movetoworkspacesilent, 8
bind = SUPER ALT, 9, movetoworkspacesilent, 9
bind = SUPER ALT, 0, movetoworkspacesilent, 10

# Silent transfer with mouse wheel (Super+Alt+Wheel)
bind = SUPER ALT, mouse_up, movetoworkspacesilent, r+1
bind = SUPER ALT, mouse_down, movetoworkspacesilent, r-1

bind = SUPER CTRL, S, exec, hyprctl keyword general:layout scrolling
bind = SUPER CTRL SHIFT, S, exec, hyprctl keyword general:layout dwindle
