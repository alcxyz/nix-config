name: Update dms-plugins

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily (1h after dms-plugins update)
  workflow_dispatch:        # allow manual runs

jobs:
  update:
    name: Update dms-plugins input
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update dms-plugins input
        run: nix flake update dms-plugins

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet flake.lock; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open / refresh PR
        if: steps.check.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: update/dms-plugins
          commit-message: "chore: update dms-plugins input"
          title: "chore: update dms-plugins input"
          body: |
            Automated update of **dms-plugins** flake input.

            This pulls in the latest plugin versions from the dms-plugins bundle.
          labels: automated
          reviewers: alcxyz
