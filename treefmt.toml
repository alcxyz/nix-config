tree-root-file = "flake.nix"

[formatter.nix]
command = "alejandra"
includes = ["*.nix"]

[formatter.shell]
command = "shfmt"
options = ["-w", "-i", "2", "-ci"]
includes = [
  "scripts/checks/*.sh",
  "modules/home-manager/programs/ai/merge-settings.sh",
  "modules/home-manager/workspace/workspace-sync.sh",
  "scripts/ci/*.sh",
  "scripts/forgejo/publish-nix-packages-lock.sh",
  "scripts/ops/*.sh",
  "modules/nixos/services/wolf-streaming/browser-image/*.sh",
]
