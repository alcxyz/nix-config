tree-root-file = "flake.nix"

[formatter.nix]
command = "alejandra"
includes = ["*.nix"]

[formatter.shell]
command = "shfmt"
options = ["-w", "-i", "2", "-ci"]
includes = [
  "scripts/checks/*.sh",
  "modules/home-manager/programs/ai/merge-settings.sh",
  "modules/home-manager/programs/ai/t3-thread-inventory.sh",
  "modules/home-manager/programs/ai/t3-thread-overview-render.sh",
  "modules/home-manager/services/t3code/link-preview-browser.sh",
  "modules/home-manager/workspace/workspace-sync.sh",
  "scripts/ci/*.sh",
  "scripts/forgejo/publish-nix-packages-lock.sh",
  "scripts/ops/*.sh",
  "modules/nixos/services/snapshot-restic-home/*.sh",
  "modules/nixos/services/storage-health-monitor/*.sh",
  "modules/nixos/services/wolf-streaming/browser-image/*.sh",
]
