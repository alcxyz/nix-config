tree-root-file = "flake.nix"

[formatter.nix]
command = "alejandra"
includes = ["*.nix"]

[formatter.shell]
command = "shfmt"
options = ["-w", "-i", "2", "-ci"]
includes = [
  "scripts/checks/*.sh",
  "scripts/ci/verify-ai-package-stack.sh",
  "scripts/ops/*.sh",
  "packages/nix-deploy/deploy",
  "modules/nixos/services/wolf-streaming/browser-image/*.sh",
]
